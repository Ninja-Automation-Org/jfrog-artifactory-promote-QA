apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: jfrog-repo
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  jfrog-repo-job:
    steps:
      - name: checkout-source-code
        uses: cloudbees-io/checkout@v1
      - name: jfrog-actions-workflow-promote-file
        uses: cloudbees-io/jfrog-artifactory-promote-image@v1
        with:
          url: ${{ vars.JFROG_URL }}
          username: ${{ vars.JFROG_ACTIONS_USERNAME }}
          password: ${{ secrets.JFROG_ACTIONS_PASSWORD }}
          source-repository-name: jfrog-test-source
          target-repository-name: jfrog-test-target
          source-image-name: action-test-image
          target-image-name: action-test-image
          source-tag: latest
          target-tag: latest
          copy: "true"
